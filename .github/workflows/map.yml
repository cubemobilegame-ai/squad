name: Mapa na stronę (jednorazowo)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 tools/mkmap.py
      - name: Zapis do repo
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add landing/map
          git commit -m "Landing: prerendered map mosaics (OSM, dark)" || exit 0
          git pull --rebase -q; git push
