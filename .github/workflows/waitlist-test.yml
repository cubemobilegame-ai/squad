name: Test zapisu na listę premierową (ręczny)

on: { workflow_dispatch: {} }

jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test reguł i zapisu
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          KEY=AIzaSyC8fKKVOkbCo5d3Yc5ZknZdBDuP6pxxlHo; P=squad-64cd5
          URL="https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents:commit?key=$KEY"
          mk() { # id email consent extra
            echo "{\"writes\":[{\"update\":{\"name\":\"projects/$P/databases/(default)/documents/waitlist/$1\",\"fields\":{\"email\":{\"stringValue\":\"$2\"},\"lang\":{\"stringValue\":\"pl\"},\"consent\":{\"booleanValue\":$3},\"sent\":{\"booleanValue\":false}$4}},\"updateTransforms\":[{\"fieldPath\":\"at\",\"setToServerValue\":\"REQUEST_TIME\"}],\"currentDocument\":{\"exists\":false}}]}"
          }
          code() { curl -s -o /tmp/o.txt -w "%{http_code}" -H 'Content-Type: application/json' -d "$1" "$URL"; }
          echo "poprawny:        $(code "$(mk zz-test-1 test-zapis@example.com true)")"
          echo "duplikat:        $(code "$(mk zz-test-1 test-zapis@example.com true)")"
          echo "zły e-mail:      $(code "$(mk zz-test-2 nie-email true)")"
          echo "bez zgody:       $(code "$(mk zz-test-3 a@b.pl false)")"
          echo "obce pole:       $(code "$(mk zz-test-4 a@b.pl true ',\"x\":{\"stringValue\":\"1\"}')")"
          echo "odczyt (ma być 403):"; curl -s -o /dev/null -w "%{http_code}\n" "https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents/waitlist?key=$KEY"
          # sprzątanie kontem serwisowym
          echo "$SA" > sa.json; export GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa.json
          TOK=$(npx -y google-auth-library@9 --help >/dev/null 2>&1; node -e '
            const c=require("crypto"),sa=require("./sa.json");const b=o=>Buffer.from(JSON.stringify(o)).toString("base64url");const n=Math.floor(Date.now()/1000);
            const h=b({alg:"RS256",typ:"JWT"})+"."+b({iss:sa.client_email,scope:"https://www.googleapis.com/auth/datastore",aud:"https://oauth2.googleapis.com/token",iat:n,exp:n+3000});
            const sig=c.sign("RSA-SHA256",Buffer.from(h),sa.private_key).toString("base64url");
            fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion="+h+"."+sig}).then(r=>r.json()).then(j=>console.log(j.access_token))')
          curl -s "https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents/waitlist/zz-test-1" -H "Authorization: Bearer $TOK" | head -c 400; echo
          curl -s -o /dev/null -w "sprzątanie: %{http_code}\n" -X DELETE "https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents/waitlist/zz-test-1" -H "Authorization: Bearer $TOK"
