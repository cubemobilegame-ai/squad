name: Awatary – generuj

# Uruchamiane ręcznie: tworzy awatary DiceBear (Lorelei i Notionists – CC0, Adventurer – CC BY 4.0) i zapisuje je w repozytorium.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-audit --no-fund @dicebear/core@9 @dicebear/collection@9
      - run: node tools/avatars.mjs
      - name: Zapisz w repozytorium
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add public/avatars
          git commit -m "Awatary DiceBear (wygenerowane automatycznie)" || echo "bez zmian"
          git push
