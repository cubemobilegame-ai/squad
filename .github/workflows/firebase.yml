name: Firebase – wdrożenie

# Po każdej zmianie w aplikacji wysyła na Firebase stronę (Hosting) i reguły bazy (Firestore). Działa na darmowym planie Spark.
on:
  push:
    branches: [main]
    paths-ignore: ["android/**", "sklep/**", "**.md", ".github/workflows/android*.yml", ".github/workflows/automat.yml", "tools/cron.cjs"]
  workflow_dispatch:

concurrency: { group: firebase, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Klucz dostępu do Firebase (sekret FIREBASE_SERVICE_ACCOUNT)
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then echo "::error::Brak sekretu FIREBASE_SERVICE_ACCOUNT – zobacz instrukcję"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          node -e 'const j=require(process.env.RUNNER_TEMP+"/sa.json");console.log("Projekt:",j.project_id,"| konto:",j.client_email)'

      - name: Podgląd linku dla zaproszeń do grup (grupa.html)
        run: node tools/og-grupa.mjs

      - name: Linki otwierane w aplikacji (assetlinks.json)
        env: { FP: "${{ secrets.ANDROID_SHA256 }}" }
        run: node tools/assetlinks.mjs

      - name: Wdrożenie (Hosting + reguły i indeksy bazy)
        run: |
          PROJECT=$(node -e 'console.log(require(process.env.RUNNER_TEMP+"/sa.json").project_id)')
          npx -y firebase-tools@13 deploy --project "$PROJECT" --non-interactive --force --only hosting,firestore
