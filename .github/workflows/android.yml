name: Android – AAB i APK

# Buduje aplikację na Androida (Trusted Web Activity – otwiera SQUAD z Firebase Hosting jak natywną apkę).
# Wynik: zakładka Releases → plik .aab do Sklepu Play i .apk do instalacji na telefonie.
on:
  push:
    branches: [main]
    paths: ["android/**", "public/manifest.json", "public/icon-*.png", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Licencje Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generator projektu (Bubblewrap)
        run: |
          npm install --no-audit --no-fund --no-save @bubblewrap/core@1 2>&1 | tee -a build.log
          (cd public && python3 -m http.server 8099 > /dev/null 2>&1 &) ; sleep 2
          VERSION_CODE=$(( ${{ github.run_number }} + 1 )) node android/generate.mjs 2>&1 | tee -a build.log
          sed -i -E 's/minSdkVersion [0-9]+/minSdkVersion 24/; s/minSdk = [0-9]+/minSdk = 24/' build-android/app/build.gradle* || true
          grep -n -E 'minSdk' build-android/app/build.gradle* || true
          # R8 zmienia nazwy klas androidbrowserhelper -> crash przy starcie (Component class R.u does not exist). Wyłącz skracanie kodu i zachowaj klasy.
          sed -i -E 's/minifyEnabled true/minifyEnabled false/; s/isMinifyEnabled = true/isMinifyEnabled = false/; s/shrinkResources true/shrinkResources false/' build-android/app/build.gradle* || true
          printf '\n-keep class com.google.androidbrowserhelper.** { *; }\n-keep class com.cubemobilegames.squad.** { *; }\n' >> build-android/app/proguard-rules.pro || true
          grep -n -E 'minify|shrink' build-android/app/build.gradle* || true
          ls build-android

      - name: Zbuduj AAB i APK
        working-directory: build-android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log

      - name: Podpisz
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          V="$(cat android/version.txt)"; N=$(( ${{ github.run_number }} + 1 ))
          AAB=$(ls build-android/app/build/outputs/bundle/release/*.aab | head -1)
          APK=$(ls build-android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p wynik
          if [ -n "$KS" ] && [ -n "$PASS" ]; then
            echo "$KS" | base64 -d > upload.jks
            cp "$AAB" "wynik/squad-$V-$N.aab"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$PASS" -keypass "$PASS" "wynik/squad-$V-$N.aab" squad
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks upload.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias squad --out "wynik/squad-$V-$N.apk" aligned.apk
            keytool -list -v -keystore upload.jks -storepass "$PASS" | grep "SHA256:" | sed 's/.*SHA256: //' > /tmp/sha.txt
            rm -f upload.jks aligned.apk
            echo "PODPIS=tak" >> "$GITHUB_ENV"; echo "SHA=$(cat /tmp/sha.txt)" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak klucza podpisu – APK z TESTOWYM podpisem (do instalacji na telefonie), AAB niepodpisany (nie do Sklepu Play)"
            keytool -genkeypair -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=SQUAD test" >/dev/null 2>&1
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks test.jks --ks-pass pass:testtest --key-pass pass:testtest --ks-key-alias test --out "wynik/squad-$V-$N-test.apk" aligned.apk
            cp "$AAB" "wynik/squad-$V-$N-niepodpisany.aab"; rm -f test.jks aligned.apk
            echo "PODPIS=testowy (tylko APK do testów)" >> "$GITHUB_ENV"; echo "SHA=-" >> "$GITHUB_ENV"
          fi
          ls -la wynik

      - name: Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="$(cat android/version.txt)"; N=$(( ${{ github.run_number }} + 1 ))
          gh release create "android-$V-$N" wynik/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SQUAD Android $V (versionCode $N)" --prerelease \
            --notes "AAB do Sklepu Play, APK do instalacji na telefonie. Podpisane: $PODPIS. Odcisk SHA-256 klucza: $SHA"

      - name: Log błędu do Releases
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          touch build.log; tail -c 300000 build.log > build-error.log
          gh release create "android-blad-${{ github.run_number }}" build-error.log --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Błąd budowania ${{ github.run_number }}" --notes "Log błędu – wyślij go Claude"
