name: iOS – TestFlight

# Buduje aplikację iOS (Capacitor: ładuje SQUAD z Firebase Hosting jak natywną apkę) i wysyła do TestFlight.
# Wymaga sekretów: ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8 (+ FIREBASE_SERVICE_ACCOUNT). Zmiany w public/ NIE wymagają nowego builda.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: QSZS4P7LQB
      BUNDLE_ID: com.cubemobilegames.squad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Xcode 26 (wymagany przez App Store Connect)
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && { echo "::error::Brak Xcode 26 na runnerze"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version

      - name: Konfiguracja Firebase (aplikacja iOS)
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          mkdir -p ios-build && cd ios-build
          [ -z "$SA" ] && { echo "::error::Brak FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          echo "$SA" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(node -e 'console.log(require(process.env.RUNNER_TEMP+"/sa.json").project_id)')
          FT="npx -y firebase-tools@13"
          ID=$($FT apps:list IOS --project "$P" --json 2>/dev/null | sed -n '/^{/,$p' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const a=(j.result||[]).find(x=>x.bundleId===process.argv[1]);console.log(a?a.appId:"")}catch{console.log("")}})' "$BUNDLE_ID")
          if [ -z "$ID" ]; then
            $FT apps:create IOS "SQUAD iOS" --bundle-id "$BUNDLE_ID" --project "$P" --json > create.json 2>&1 || true
            ID=$(grep -o '"appId": *"[^"]*"' create.json | head -1 | sed -E 's/.*: *"([^"]*)"/\1/')
          fi
          [ -z "$ID" ] && { echo "::error::Nie udało się utworzyć aplikacji iOS w Firebase: $(head -c 400 create.json)"; exit 1; }
          echo "Firebase iOS appId: $ID"
          $FT apps:sdkconfig IOS "$ID" --project "$P" > GoogleService-Info.plist
          python3 - <<'PY'
          import plistlib, re, json
          t = open("GoogleService-Info.plist").read()
          m = re.search(r"<\?xml.*</plist>", t, re.S)
          d = plistlib.loads(m.group(0).encode())
          cfg = {"GOOGLE_APP_ID": d["GOOGLE_APP_ID"], "GCM_SENDER_ID": d["GCM_SENDER_ID"], "API_KEY": d["API_KEY"], "PROJECT_ID": d["PROJECT_ID"], "CLIENT_ID": d.get("CLIENT_ID", ""), "STORAGE_BUCKET": d.get("STORAGE_BUCKET", "")}
          json.dump(cfg, open("fbcfg.json", "w"))
          print({k: (v[:8] + "…" if v else v) for k, v in cfg.items()})
          PY
          python3 ../ios/fbid.py "$RUNNER_TEMP/sa.json" fbcfg.json

      - name: Projekt Capacitor (iOS)
        run: |
          cd ios-build
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor/app@7 @capacitor/browser@7 @capacitor/geolocation@7 @capacitor/keyboard@7 @ebarooni/capacitor-calendar@^7 @capacitor-firebase/authentication@7 ../ios/squad-widget @capacitor-firebase/messaging@7 firebase@11
          mkdir -p www && echo '<!doctype html><title>Squad</title>' > www/index.html
          cp ../ios/capacitor.config.json capacitor.config.json
          npx cap add ios
          FB_CLIENT_TOKEN=d80705974fb58fbaf041eb63a4574336 python3 ../ios/patch.py .. .
          # widżet iOS (rozszerzenie WidgetKit + App Group)
          python3 - <<'PY'
          import plistlib
          p = "ios/App/App/App.entitlements"
          d = plistlib.load(open(p, "rb"))
          d["com.apple.security.application-groups"] = ["group.com.cubemobilegames.squad"]
          plistlib.dump(d, open(p, "wb"))
          PY
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby ../ios/add_widget.rb .. .
          # ikona 1024 (bez kanału alfa) z repozytorium
          mkdir -p tmp && cp ../sklep/apple/ikona-1024.png tmp/icon.png
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do cp tmp/icon.png "$f"; done
          cd ios/App && rm -rf Podfile.lock Pods && pod install --repo-update
          ls

      - name: Archiwum i wysyłka do TestFlight
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cd ios-build/ios/App
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          BUNDLE_ID=$BUNDLE_ID python3 ../../../ios/asc.py "$KEY"
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          BUILD=$(( ${{ github.run_number }} + 10 ))
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Squad.xcarchive" archive $AUTH \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic MARKETING_VERSION=1.1.0 CURRENT_PROJECT_VERSION=$BUILD \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 40
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Squad.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist" $AUTH | tail -n 30
          echo "::notice::Build $BUILD wysłany do App Store Connect (TestFlight)"

      - name: Kompilacja dla symulatora (do weryfikacji Meta)
        continue-on-error: true
        run: |
          cd ios-build/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" EXCLUDED_ARCHS=x86_64 \
            MARKETING_VERSION=1.1.0 CURRENT_PROJECT_VERSION=1 | tail -n 15
          mkdir -p "$RUNNER_TEMP/simout" && cp -R "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator/App.app" "$RUNNER_TEMP/simout/Squad.app"
          cd "$RUNNER_TEMP/simout" && zip -qr "$GITHUB_WORKSPACE/Squad-simulator.zip" Squad.app

      - name: Plik symulatora do Releases
        continue-on-error: true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "ios-simulator-${{ github.run_number }}" Squad-simulator.zip --repo "$GITHUB_REPOSITORY" \
            --title "Squad iOS – symulator (build ${{ github.run_number }})" --notes "Kompilacja dla symulatora iOS (Squad.app) – do weryfikacji Meta."
