name: Android – test uruchomienia (emulator)

# Instaluje APK z Releases na emulatorze, uruchamia aplikację i pokazuje błędy (crash) w adnotacjach.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Tag wydania, np. android-1.0.0-6", required: true }

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Powiązanie strony z aplikacją (assetlinks)
        run: |
          J=$(curl -s https://squad-64cd5.web.app/.well-known/assetlinks.json | tr -d '\n' | head -c 600)
          echo "::notice title=assetlinks::$J"
      - name: Pobierz APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir .
          ls -la *.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: |
            APK=$(ls *.apk | head -1); adb install -r "$APK" && echo "::notice::Zainstalowano $APK" || echo "::error::Instalacja nie powiodła się"
            adb logcat -c
            adb shell monkey -p com.cubemobilegames.squad -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | head -2 | sed "s/^/::notice title=Po starcie::/"
            adb shell pm grant com.cubemobilegames.squad android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -a android.intent.action.VIEW -d "squadapp://push" >/dev/null 2>&1 || true
            sleep 3
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | head -1 | sed "s/^/::notice title=Po squadapp:\/\/push::/"
            sleep 17
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -3 | sed 's/^/::notice::Aktywna: /'
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > err.txt || true
            if [ -s crash.txt ]; then echo "::error title=CRASH::$(head -c 3500 crash.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; else echo "::notice::Brak crasha w logach"; fi
            grep -iE "squad|AndroidRuntime|FATAL|browserhelper|twa" err.txt | head -60 > e2.txt || true
            if [ -s e2.txt ]; then echo "::warning title=BLEDY::$(head -c 3500 e2.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; fi
            adb exec-out screencap -p > ekran.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android
          retention-days: 3
          path: |
            *.txt
            ekran.png
