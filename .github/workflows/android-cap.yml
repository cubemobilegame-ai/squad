name: Android (Capacitor) – AAB i APK

# NOWA aplikacja Android (Capacitor 7, tak jak iOS): natywne logowanie Google, powiadomienia FCM, lokalizacja, kalendarz, linki.
# Stary build (android.yml, Trusted Web Activity) zostaje bez zmian. Wynik: Releases → "android-cap-…" (AAB do Play + APK do testów).
on:
  push:
    branches: [main]
    paths: ["android-cap/**", ".github/workflows/android-cap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      VERSION_NAME: "2.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Licencje Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Klucz podpisu
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "HAVE_KS=1" >> "$GITHUB_ENV"; fi

      - name: Firebase (aplikacja Android + SHA-1 + google-services.json)
        env:
          SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          PASS: "${{ secrets.ANDROID_KEY_PASS }}"
        run: |
          mkdir -p cap
          if [ -z "$SA" ]; then echo "::error::Brak FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(node -e 'console.log(require(process.env.RUNNER_TEMP+"/sa.json").project_id)'); PKG=$(node -e 'console.log(require("./android/app.json").packageId)')
          FT="npx -y firebase-tools@13"
          ID=$($FT apps:list ANDROID --project "$P" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const a=(j.result||[]).find(x=>x.packageName===process.argv[1]);console.log(a?a.appId:"")}catch{console.log("")}})' "$PKG")
          if [ -z "$ID" ]; then
            $FT apps:create ANDROID "SQUAD Android" --package-name "$PKG" --project "$P" --json > create.json 2>&1 || true
            ID=$(node -e 'try{const j=JSON.parse(require("fs").readFileSync("create.json","utf8"));console.log((j.result||{}).appId||"")}catch{console.log("")}')
          fi
          [ -z "$ID" ] && { echo "::error::Nie ma aplikacji Android w Firebase: $(head -c 300 create.json 2>/dev/null | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Firebase Android appId::$ID"
          if [ -n "$HAVE_KS" ] && [ -n "$PASS" ]; then
            S1=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" 2>/dev/null | grep "SHA1:" | head -1 | sed 's/.*SHA1: //')
            S256=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
            for h in "$S1" "$S256"; do [ -n "$h" ] && $FT apps:android:sha:create "$ID" "$h" --project "$P" 2>&1 | tail -1 || true; done
            echo "::notice title=SHA-1 klucza uploadu::$S1"
          fi
          P1=$(grep -E '^[0-9A-F]{2}(:[0-9A-F]{2}){19}$' android/sha1-play.txt | tail -1)
          [ -n "$P1" ] && { $FT apps:android:sha:create "$ID" "$P1" --project "$P" 2>&1 | tail -1 || true; echo "::notice title=Klucz Play SHA-1 zarejestrowany::$P1"; }
          PLAY=$(grep -E '^[0-9A-F]{2}(:[0-9A-F]{2}){31}$' android/sha256.txt | tail -1)
          [ -n "$PLAY" ] && { $FT apps:android:sha:create "$ID" "$PLAY" --project "$P" 2>&1 | tail -1 || true; echo "::notice title=Klucz Play SHA-256 zarejestrowany::$PLAY"; }
          for i in 1 2 3; do $FT apps:sdkconfig ANDROID "$ID" --project "$P" > sdk.txt 2>&1 && break; sleep 5; done
          mkdir -p build-android/app && node android/gservices.cjs "$ID"
          cp build-android/app/google-services.json cap/google-services.json
          node -e 'const g=require("./cap/google-services.json");const c=g.client[0];console.log("oauth_client:",(c.oauth_client||[]).map(o=>o.client_type).join(",")||"BRAK")'

      - name: Projekt Capacitor (Android)
        run: |
          cd cap
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/browser@7 @capacitor/geolocation@7 @ebarooni/capacitor-calendar@^7 @capacitor-firebase/authentication@7 @capacitor-firebase/messaging@7 firebase@11
          mkdir -p www && echo '<!doctype html><title>Squad</title>' > www/index.html
          cp ../android-cap/capacitor.config.json capacitor.config.json
          npx cap add android
          cp google-services.json android/app/google-services.json
          pip install --quiet pillow 2>&1 | tail -1 || true
          VERSION_CODE=$(( 10000 + ${{ github.run_number }} )) python3 ../android-cap/patch.py .. .
          python3 ../android-cap/icons.py .. .
          npx cap sync android
          # reguły Google services: wtyczka dla pakietu
          grep -n "google-services" android/app/build.gradle android/build.gradle || true

      - name: Zbuduj AAB i APK
        working-directory: cap/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../../build.log

      - name: Podpisz
        env:
          PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          V="$VERSION_NAME"; N=$(( 10000 + ${{ github.run_number }} ))
          AAB=$(ls cap/android/app/build/outputs/bundle/release/*.aab | head -1)
          APK=$(ls cap/android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p wynik
          if [ -n "$HAVE_KS" ] && [ -n "$PASS" ]; then
            cp "$AAB" "wynik/squad-cap-$V-$N.aab"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" -keypass "$PASS" "wynik/squad-cap-$V-$N.aab" squad
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias squad --out "wynik/squad-cap-$V-$N.apk" aligned.apk
            echo "PODPIS=tak" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak klucza – APK testowy"
            keytool -genkeypair -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=SQUAD test" >/dev/null 2>&1
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks test.jks --ks-pass pass:testtest --key-pass pass:testtest --ks-key-alias test --out "wynik/squad-cap-$V-$N-test.apk" aligned.apk
            echo "PODPIS=testowy" >> "$GITHUB_ENV"
          fi
          ls -la wynik

      - name: Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="$VERSION_NAME"; N=$(( 10000 + ${{ github.run_number }} ))
          gh release create "android-cap-$V-$N" wynik/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SQUAD Android (Capacitor) $V – versionCode $N" --prerelease \
            --notes "NOWA wersja natywna. AAB do Sklepu Play, APK do instalacji na telefonie. Podpisane: $PODPIS."

      - name: Log błędu do Releases
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          touch build.log; tail -c 300000 build.log > build-error.log
          gh release create "android-cap-blad-${{ github.run_number }}" build-error.log --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Błąd budowania android-cap ${{ github.run_number }}" --notes "Log błędu"
