name: Testy reguł Firestore

on:
  push:
    branches: ["**"]
    paths: ["firestore.rules", "tests/**", ".github/workflows/rules-test.yml"]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Zależności
        run: |
          mkdir -p t && cd t && npm init -y >/dev/null
          npm i --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Emulator i testy
        run: |
          cp tests/rules.test.mjs t/rules.test.mjs
          cd t && cp ../firestore.rules . && echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080,"host":"127.0.0.1"},"ui":{"enabled":false}}}' > firebase.json
          npx firebase emulators:exec --only firestore --project demo-squad "node rules.test.mjs" 2>&1 | tee ../test.log
