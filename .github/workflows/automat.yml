name: Automat – powiadomienia i sprzątanie

# Co ok. 10 minut: wysyła powiadomienia push (wiadomości, odpowiedzi, nowe osoby, zmiany, przypomnienia)
# i usuwa dropy 24 h po starcie. Zastępuje płatne funkcje w chmurze (plan darmowy Spark).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: { group: automat, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Klucz dostępu
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then echo "::warning::Brak sekretu FIREBASE_SERVICE_ACCOUNT – pomijam"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"; echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Biblioteki
        if: env.SKIP != '1'
        run: npm install --prefix tools --no-audit --no-fund
      - name: Powiadomienia i sprzątanie
        if: env.SKIP != '1'
        run: node tools/cron.cjs
