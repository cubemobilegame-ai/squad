<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(/fonts/bricolage.woff);font-weight:400 800}
*{margin:0}body{background:transparent}
.i{width:512px;height:512px;position:relative;overflow:hidden;background:#0a0a0c;font-family:B}
.i .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:-.05em;font-size:var(--fs);padding-bottom:var(--pb)}
.i img{position:absolute;width:var(--hs);height:var(--hs);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.i .a{left:var(--o);top:var(--o);transform:rotate(135deg)}
.i .b{right:var(--o);bottom:var(--o);transform:scaleX(-1) rotate(45deg)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,rgba(255,79,134,.28),transparent 45%),radial-gradient(circle at 85% 85%,rgba(77,163,255,.26),transparent 45%)}
</style>
<div class="i" id="n" style="--fs:126px;--pb:12px;--hs:220px;--o:-58px"><div class="glow"></div><img class="a" src="/ic-hl.png"><img class="b" src="/ic-hr.png"><div class="t">Squad</div></div>
<div class="i" id="m" style="--fs:104px;--pb:10px;--hs:160px;--o:36px"><div class="glow"></div><img class="a" src="/ic-hl.png"><img class="b" src="/ic-hr.png"><div class="t">Squad</div></div>
