tl:"SQUAD służy do umawiania się ze znajomymi na wspólne wypady. Szanuj innych, nie udostępniaj cudzych danych i zgłaszaj wszystko, co cię niepokoi.",
s:[["1. Kto prowadzi SQUAD","Aplikację SQUAD (strona squad-64cd5.web.app i aplikacja na Androida com.cubemobilegames.squad) udostępnia Jordan Żak, prowadzący działalność gospodarczą pod firmą Bezdluzni.pl Jordan Żak, ul. Anielewicza 26A lok. 56, 01-052 Warszawa, NIP 5272505739 (marka Cube Mobile Games). Kontakt: cubemobilegame@gmail.com."],
["2. Kto może korzystać","SQUAD jest dla osób, które ukończyły 13 lat. Przy pierwszym uruchomieniu potwierdzasz swój wiek. Jeśli masz mniej niż 16 lat, potrzebujesz zgody rodzica lub opiekuna. Korzystanie z aplikacji jest bezpłatne."],
["3. Twoje konto","Konto zakładasz, logując się przez Google albo Facebooka. Bez konta możesz tylko odpowiedzieć na zaproszenie z linku. Ksywkę, awatar lub zdjęcie profilowe widzą osoby z twoich dropów i grup. Nie podszywaj się pod innych i nie używaj cudzych zdjęć. Ksywka nie może zawierać wulgaryzmów."],
["4. Czego nie wolno","Nie wolno publikować ani wysyłać: hejtu, nękania i gróźb, treści seksualnych, przemocy, namawiania do niebezpiecznych lub nielegalnych rzeczy (w tym do alkoholu, narkotyków i hazardu), spamu i oszustw, a także cudzych danych (adresu, numeru telefonu, zdjęć) bez zgody tej osoby. Wulgaryzmy w czatach są automatycznie zakrywane."],
["5. Dropy, linki i czaty","Czaty są tylko grupowe – nie ma prywatnych wiadomości. Każdy, kto ma link, zobaczy drop albo grupę, więc wysyłaj go tylko znajomym. Na czacie dropa piszą osoby, które odpowiedziały IN lub LATE. Drop, jego czat, zdjęcia i link znikają 24 h po starcie. Grupy i ich czaty zostają, dopóki właściciel ich nie usunie."],
["6. Spotkania na żywo","SQUAD pomaga się umówić, ale nie organizuje spotkań i nie odpowiada za nie ani za zachowanie uczestników. Spotykaj się w miejscach publicznych i mów bliskim, dokąd idziesz."],
["7. Zgłoszenia i blokowanie","Przytrzymaj wiadomość na czacie, żeby ją zgłosić albo zablokować autora. Zgłoszenia trafiają do nas od razu i sprawdzamy je najszybciej, jak to możliwe. Za łamanie regulaminu możemy usunąć treść, drop lub grupę albo zablokować konto. Treści niezgodne z prawem zgłaszamy odpowiednim służbom."],
["8. Reklamacje i kontakt","Problemy z działaniem aplikacji i reklamacje zgłaszaj na cubemobilegame@gmail.com. Odpowiadamy w ciągu 14 dni."],
["9. Usunięcie konta","Konto usuniesz w każdej chwili: Profil → Więcej opcji konta → Usuń konto albo przez stronę squad-64cd5.web.app/usun-konto."],
["10. Zmiany","Gdy zmienimy regulamin, poinformujemy cię o tym w aplikacji co najmniej 7 dni wcześniej. W sprawach nieuregulowanych stosuje się prawo polskie; nie ogranicza to praw, które przysługują ci jako konsumentowi."]]},

s:[["1. Administrator danych","Administratorem twoich danych osobowych jest Jordan Żak, prowadzący działalność gospodarczą pod firmą Bezdluzni.pl Jordan Żak, ul. Anielewicza 26A lok. 56, 01-052 Warszawa, NIP 5272505739 (marka Cube Mobile Games). Kontakt w sprawie danych: cubemobilegame@gmail.com."],

["3. Po co i na jakiej podstawie","• żeby aplikacja działała – dropy, grupy, czaty, powiadomienia (art. 6 ust. 1 lit. b RODO – wykonanie umowy, czyli regulaminu),<br>• żeby dbać o bezpieczeństwo, sprawdzać zgłoszenia i naprawiać błędy (art. 6 ust. 1 lit. f RODO – nasz prawnie uzasadniony interes),<br>• żeby spełniać obowiązki prawne (art. 6 ust. 1 lit. c RODO)."],
["4. Kto widzi twoje dane","Ksywkę, awatar i odpowiedź widzą osoby z danego dropa lub grupy (czyli każdy, kto ma link). Wiadomości i zdjęcia widzą tylko osoby z danego czatu. Twojego adresu e-mail nie pokazujemy nikomu. Nie sprzedajemy danych i nie używamy ich do reklam."],
["5. Komu powierzamy dane","Korzystamy z usług, które przetwarzają dane na nasze zlecenie: Google Firebase (logowanie, baza danych, hosting, powiadomienia – Google Ireland Ltd.), Cloudflare (serwer wysyłający powiadomienia – Cloudflare Inc.), Meta Platforms (logowanie przez Facebooka, jeśli je wybierzesz) oraz FormSubmit (powiadomienie e-mail o nowym zgłoszeniu – bez treści wiadomości). Część z tych firm może przetwarzać dane poza EOG – na podstawie standardowych klauzul umownych Komisji Europejskiej lub programu EU–US Data Privacy Framework."],
["6. Jak długo","Dropy, odpowiedzi, czaty i zdjęcia dropów usuwamy automatycznie 24 h po starcie dropa. Grupy i ich czaty – gdy właściciel usunie grupę. Profil i token powiadomień – gdy usuniesz konto. Zgłoszenia przechowujemy do 90 dni od ich rozpatrzenia."],
["7. Twoje prawa","Masz prawo dostępu do swoich danych, ich sprostowania, usunięcia, ograniczenia przetwarzania i przeniesienia, a także prawo sprzeciwu wobec przetwarzania opartego na naszym uzasadnionym interesie. Napisz na cubemobilegame@gmail.com. Możesz też złożyć skargę do Prezesa Urzędu Ochrony Danych Osobowych (ul. Stawki 2, 00-193 Warszawa)."],
["8. Dzieci i młodzież","SQUAD jest dla osób od 13 lat. Jeśli masz mniej niż 16 lat, korzystasz z aplikacji za zgodą rodzica lub opiekuna. Jeśli dowiemy się, że konto ma osoba poniżej 13 lat, usuniemy je. Rodzic może poprosić o usunięcie danych dziecka, pisząc na cubemobilegame@gmail.com."],
["9. Usunięcie konta i danych","W aplikacji: Profil → Więcej opcji konta → Usuń konto. Bez aplikacji: squad-64cd5.web.app/usun-konto."],
["10. Pliki cookies i pamięć urządzenia","Nie używamy cookies reklamowych ani analitycznych. Aplikacja zapisuje w pamięci urządzenia tylko ustawienia (np. język, awatar) i dane potrzebne do logowania."],
["11. Zmiany","O zmianach polityki poinformujemy cię w aplikacji."]]},
safety:{t:"Zasady bezpieczeństwa",tl:"W skrócie: linki tylko dla znajomych, spotkania w miejscach publicznych, a bliscy wiedzą, gdzie jesteś.",
s:[["Wysyłaj linki tylko znajomym","Kto ma link, ten widzi drop. Nie wrzucaj linków publicznie, np. w komentarzach."],
["Nie podawaj prywatnych danych","Adresu domowego, numeru telefonu ani haseł nie piszemy na czatach."],
["Spotykaj się w miejscach publicznych","Szczególnie wtedy, gdy w ekipie jest ktoś, kogo nie znasz osobiście."],
["Mów bliskim, dokąd idziesz","Rodzic, opiekun albo starsze rodzeństwo powinni wiedzieć, gdzie i z kim jesteś."],

en:{terms:{t:"Terms of Use",u:"Effective from 1 November 2026",
tl:"SQUAD helps you plan hangouts with your friends. Respect others, don't share other people's personal info, and report anything that worries you.",
s:[["1. Who runs SQUAD","SQUAD (the website squad-64cd5.web.app and the Android app com.cubemobilegames.squad) is provided by Jordan Żak, sole trader operating as Bezdluzni.pl Jordan Żak, ul. Anielewicza 26A lok. 56, 01-052 Warsaw, Poland, tax ID (NIP) 5272505739 (brand: Cube Mobile Games). Contact: cubemobilegame@gmail.com."],
["2. Who can use it","SQUAD is for people aged 13 and over. You confirm your age when you first open the app. If you're under 16, you need permission from a parent or guardian. SQUAD is free to use."],
["3. Your account","You create an account by signing in with Google or Facebook. Without an account you can only reply to an invite link. People in your drops and groups can see your nickname, avatar or profile photo. Don't pretend to be someone else or use other people's photos. Nicknames can't contain swear words."],
["4. What's not allowed","Don't post or send hate, bullying or threats, sexual content, violence, encouragement of dangerous or illegal things (including alcohol, drugs and gambling), spam or scams, or anyone else's personal info (address, phone number, photos) without their permission. Swear words in chats are hidden automatically."],
["5. Drops, links and chats","Chats are group only – there are no private messages. Anyone with the link can see a drop or group, so only send it to friends. People who replied IN or LATE can write in a drop chat. A drop, its chat, photos and link disappear 24 h after it starts. Groups and their chats stay until the owner deletes them."],
["6. Meeting up in real life","SQUAD helps you plan, but it doesn't organize meetups and isn't responsible for them or for how participants behave. Meet in public places and tell someone close to you where you're going."],
["7. Reporting and blocking","Press and hold a message in a chat to report it or block its author. Reports reach us immediately and we review them as fast as we can. If you break these terms, we may remove content, drops or groups, or block your account. We report illegal content to the relevant authorities."],
["8. Complaints and contact","Send problems and complaints to cubemobilegame@gmail.com. We reply within 14 days."],
["9. Deleting your account","You can delete your account at any time: Profile → More account options → Delete account, or via squad-64cd5.web.app/delete-account."],
["10. Changes","If we change these terms, we'll let you know in the app at least 7 days in advance. Polish law applies; this doesn't limit any rights you have as a consumer where you live."]]},
privacy:{t:"Privacy Policy",u:"Effective from 1 November 2026",
tl:"We only collect what SQUAD needs to work. We don't sell your data and we don't show ads. You can delete your account and data at any time.",
s:[["1. Data controller","Your personal data is controlled by Jordan Żak, sole trader operating as Bezdluzni.pl Jordan Żak, ul. Anielewicza 26A lok. 56, 01-052 Warsaw, Poland, tax ID (NIP) 5272505739 (brand: Cube Mobile Games). Privacy contact: cubemobilegame@gmail.com."],
["2. What we collect","• from Google or Facebook sign-in: your account ID and e-mail address,<br>• your nickname, chosen avatar or profile photo,<br>• drops and groups you create, your IN / LATE / OUT replies, reactions, and whether you've read a chat or are typing,<br>• chat messages and photos added to albums,<br>• your phone's notification token (if you turn on notifications),<br>• technical info about notification errors (device and browser type),<br>• reports you send."],
["3. Why and on what legal basis","• to make the app work – drops, groups, chats, notifications (Art. 6(1)(b) GDPR – performance of the contract, i.e. these terms),<br>• to keep SQUAD safe, review reports and fix bugs (Art. 6(1)(f) GDPR – our legitimate interest),<br>• to meet legal obligations (Art. 6(1)(c) GDPR)."],
["4. Who sees your data","People in a drop or group (anyone with the link) see your nickname, avatar and reply. Messages and photos are visible only to people in that chat. We never show your e-mail address to anyone. We don't sell data or use it for ads."],
["5. Service providers","We use services that process data on our behalf: Google Firebase (sign-in, database, hosting, notifications – Google Ireland Ltd.), Cloudflare (notification server – Cloudflare Inc.), Meta Platforms (Facebook sign-in, if you choose it) and FormSubmit (e-mail alert about a new report – without message content). Some of them may process data outside the EEA under the European Commission's Standard Contractual Clauses or the EU–US Data Privacy Framework."],
["6. How long we keep it","Drops, replies, drop chats and photos are deleted automatically 24 h after the drop starts. Groups and their chats – when the owner deletes the group. Your profile and notification token – when you delete your account. Reports are kept for up to 90 days after review."],
["7. Your rights","You have the right to access, correct, delete, restrict and port your data, and to object to processing based on our legitimate interest. E-mail cubemobilegame@gmail.com. You can also complain to your data protection authority (in Poland: the President of the Personal Data Protection Office, UODO)."],
["8. Children and teens","SQUAD is for people aged 13+. If you're under 16, you use the app with a parent's or guardian's permission. If we learn that someone under 13 has an account, we'll delete it. Parents can ask us to delete their child's data at cubemobilegame@gmail.com."],
["9. Deleting your account and data","In the app: Profile → More account options → Delete account. Without the app: squad-64cd5.web.app/delete-account."],
["10. Cookies and device storage","We don't use advertising or analytics cookies. The app only stores settings (e.g. language, avatar) and sign-in data on your device."],
["11. Changes","We'll tell you in the app if this policy changes."]]},
safety:{t:"Safety tips",tl:"In short: links for friends only, meet in public places, and make sure someone close knows where you are.",
s:[["Only send links to friends","Anyone with the link can see the drop. Don't post links publicly, e.g. in comments."],
["Keep private info private","Don't share your home address, phone number or passwords in chats."],
["Meet in public places","Especially if someone in the crew is a person you don't know in real life."],
["Tell someone where you're going","A parent, guardian or older sibling should know where you are and who you're with."],
["Something wrong? Report it","Tap a message in a chat to report it or block the author. Also talk to an adult you trust."],
["Need help?","Look up your local child helpline (in the EU: 116 111, free). In an emergency, call 112 (EU) or 911 (US)."]]}}};
