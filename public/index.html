en:{terms:{t:"Terms of Use",u:"Effective from: [publication date – to be added]",
tl:"SQUAD helps you plan hangouts with your friends. Respect others, don't share other people's personal info, and report anything that worries you.",
s:[["1. Who runs SQUAD","SQUAD is provided by Cube Mobile Games [full name and address – to be added]. Contact: cubemobilegame@gmail.com."],
["2. Who can use it","SQUAD is for people aged 13 and over. If you're under 16, you need permission from a parent or guardian."],
["3. Your account","You sign in with Google. People in your drops and groups can see your nickname and profile photo. Don't pretend to be someone else or use other people's photos."],
["4. What's not allowed","Don't post or send hate, bullying or threats, sexual content, violence, encouragement of dangerous or illegal things, spam or scams, or anyone else's personal info (address, phone number, photos) without their permission."],
["5. Drops, links and chats","Chats are group only – there are no private messages. Anyone with the link can see a drop or group, so only send it to friends. Replies are open until the drop starts; the drop, its chat and its link disappear 24 h after the start. Groups stay until their owner deletes them."],
["6. Meeting up in real life","SQUAD helps you plan, but it doesn't organize meetups and isn't responsible for them. Meet in public places and tell someone close to you where you're going."],
["7. Reporting and blocking","Tap a message in a chat to report it or block its author. We review every report. If you break the rules, we may remove content or block your account."],
["8. Deleting your account","You can delete your account at any time: Profile → More account options → Delete account."],
["9. Changes","If we change these terms, we'll let you know in the app."]]},

tl:"We only collect what SQUAD needs to work. We don't sell your data. You can delete your account and data at any time.",
s:[["1. Data controller","The data controller is Cube Mobile Games [full name and address – to be added], email: cubemobilegame@gmail.com."],
["2. What we collect","• Google account data: ID and email address (for sign-in only),<br>• your nickname and profile photo or chosen avatar,<br>• drops and groups you create and your IN / LATE / OUT replies,<br>• messages in group chats,<br>• reports and your list of blocked people,<br>• technical data: app language and a notification ID."],
["3. Why","To make the app work (drops, groups, chats), to send the notifications you turn on, and to keep everyone safe (reviewing reports)."],
["4. Who sees your data","People with the link to a drop or group can see your nickname, photo and reply. Messages are visible only to people in that chat. We never show your email address to anyone."],
["5. Where it's stored","We store data in Google Firebase, which processes it on our behalf."],
["6. How long","Drops, replies and drop chats are deleted automatically 24 h after the start. Groups and their chats – when the owner deletes the group. Your profile – when you delete your account."],
["7. Your rights","You have the right to access, correct, delete, restrict and move your data, and to object to processing. You can also complain to your data protection authority (in Poland: UODO)."],
["8. Under 16","If you're under 16, you can use the app with permission from a parent or guardian."],
["9. Contact","Send privacy questions to cubemobilegame@gmail.com."]]},
